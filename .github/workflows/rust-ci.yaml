name: Rust CI

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/rust-ci.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "keratin-log/**"
      - "stroma/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rust-ci.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "keratin-log/**"
      - "stroma/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  formatting-advisory:
    name: Formatting advisory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: |
          if ! cargo fmt --all --check; then
            echo "::warning::cargo fmt --all --check failed. Formatting drift is currently non-blocking."
          fi

  workspace-tests:
    name: Workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: |
          ulimit -n 4096
          cargo test --workspace --locked

  fault-injection-tests:
    name: Fault injection tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # The feature compiles in test-only file operation faults, so it gets its
      # own build instead of joining the workspace run.
      - name: Run tests with injected I/O faults
        run: |
          ulimit -n 4096
          cargo test --locked -p keratin-log -p stroma-core --features io-fault-injection

  release-build:
    name: Release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build workspace release
        run: cargo build --workspace --release --locked

      - name: Check durable storage lifecycle
        run: cargo test --release --locked -p keratin-log --test platform_smoke

      - name: Check Windows positional I/O
        if: runner.os == 'Windows'
        run: cargo test --release --locked -p keratin-log --test windows_file_io
